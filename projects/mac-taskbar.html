    <script src="../src/JS/visitors.js?v=2" defer></script>
</head>
<body>
    <a class="skip" href="#main">본문으로 건너뛰기</a>
    <header class="topbar shell">
        <a class="wordmark" href="../" lang="en">Dozziny’s <em>Blog</em><i>.</i></a>
        <nav aria-label="블로그 메뉴">
            <a href="../#projects">바이브코딩</a><a href="../#articles">지난 글</a>
            <a href="https://github.com/Dozziny/Dozziny.github.io">GitHub <span aria-hidden="true">↗</span></a>
        </nav>
    </header>
    <main id="main" class="shell detail bar">
        <a class="back" href="../#projects">← 바이브코딩 목록</a>
        <header class="detail-head">
            <h1>맥용 윈도우 작업표시줄</h1>
            <p>맥에서도 화면 아래에 시작 메뉴를 두고, 자주 쓰는 앱을 고정하거나 실행 중인 앱으로 바로 전환해요.</p>
        </header>
        <div class="detail-grid">
            <section class="gallery" aria-label="앱 스크린샷">
                <div class="controls" role="group" aria-label="스크린샷 선택" hidden>
                    <button type="button" aria-controls="taskbar-overview" aria-pressed="true">시작 메뉴</button>
                    <button type="button" aria-controls="taskbar-search" aria-pressed="false">검색</button>
                </div>
                <figure id="taskbar-overview">
                    <div class="screen">
                        <a href="../img/apps/taskbar-overview.webp" target="_blank" rel="noopener" aria-label="시작 메뉴 원본 이미지 열기 (새 탭)">
                            <img src="../img/apps/taskbar-overview.webp" width="2200" height="1212" alt="가상 앱 목록이 표시된 밝은 테마의 시작 메뉴와 작업표시줄">
                        </a>
                    </div>
                    <figcaption>
                        <p><strong>시작 메뉴</strong>고정한 앱과 작업표시줄을 함께 볼 수 있어요. 앱 목록과 상태 표시는 테스트용으로 구성했어요.</p>
                        <a class="full-image" href="../img/apps/taskbar-overview.webp" target="_blank" rel="noopener" aria-label="시작 메뉴 크게 보기 (새 탭)">크게 보기 ↗</a>
                    </figcaption>
                </figure>
                <figure id="taskbar-search">
                    <div class="screen">
                        <a href="../img/apps/taskbar-search.webp" target="_blank" rel="noopener" aria-label="검색 원본 이미지 열기 (새 탭)">
                            <img src="../img/apps/taskbar-search.webp" width="2200" height="1212" alt="어두운 테마의 시작 메뉴에 테스트 문서 검색 결과가 표시된 화면">
                        </a>
                    </div>
                    <figcaption>
                        <p><strong>검색</strong>‘최근 문서 4개 찾아줘’라고 입력한 예시예요. 가상의 워크숍 안내문과 발표 자료가 결과에 나타나요.</p>
                        <a class="full-image" href="../img/apps/taskbar-search.webp" target="_blank" rel="noopener" aria-label="검색 크게 보기 (새 탭)">크게 보기 ↗</a>
                    </figcaption>
                </figure>
            </section>
            <section class="functions" aria-labelledby="features">
                <h2 id="features">주요 기능</h2>
                <dl>
                    <dt>시작 메뉴에서 검색</dt>
                    <dd>화면 아래의 시작 메뉴에서 이름을 입력해 앱이나 파일을 찾아요.</dd>
                    <dt>자주 쓰는 앱 고정</dt>
                    <dd>반복해서 여는 앱을 고정해 두고, 매번 이름을 검색하는 수고를 줄여요.</dd>
                    <dt>실행 중인 앱 전환</dt>
                    <dd>작업표시줄에서 앱 아이콘을 눌러 다른 앱으로 이동해요.</dd>
                </dl>
            </section>
        </div>
        <footer class="detail-footer"><a class="back" href="local-data-center.html">로컬 데이터센터 앱 보기 →</a></footer>
    </main>
</body>
</html>
